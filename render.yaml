services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: studyops-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./studyops.db

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: studyops-frontend
    env: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://studyops-backend.onrender.com/api
