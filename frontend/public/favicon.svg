<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card with Glow Border -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="12" />

  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-dasharray="16 12" opacity="0.4" />

  <!-- Academic Graduation Cap Icon -->
  <g transform="translate(256, 210) scale(1.15)" filter="url(#glow)">
    <!-- Cap Diamond Top -->
    <polygon points="0,-75 140,-10 0,55 -140,-10" fill="url(#primaryGrad)" />
    <!-- Cap Base Underside -->
    <path d="M-85,22 C-85,65 85,65 85,22 L85,45 C85,85 -85,85 -85,45 Z" fill="url(#primaryGrad)" opacity="0.9" />
    <!-- Tassel String -->
    <path d="M125,-10 L135,45 L125,75" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Tassel Knob -->
    <circle cx="125" cy="80" r="12" fill="#38bdf8" />
  </g>

  <!-- AI Autonomous Spark Lightning Bolt -->
  <path d="M280,260 L230,340 L265,340 L232,410 L295,325 L260,325 Z" fill="url(#sparkGrad)" filter="url(#glow)" />
</svg>
